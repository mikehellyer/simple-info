<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simple-Info">
<meta name="mobile-web-app-capable" content="yes">
<title>Info Remote</title>
<style>
  :root {
    --bg: #0b1020; --card: #151c33; --card2: #1d2642; --line: #2c3760;
    --text: #eef2ff; --dim: #a9b3d6; --accent: #7aa8ff; --good: #6fd38f; --hold: #ffc846;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% 0%, #1e2a55 0%, var(--bg) 60%);
    color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 14px; }
  header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
  header .status { color: var(--dim); font-size: 13px; }
  .now {
    background: linear-gradient(160deg, #1f2b55, #141a33); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin-bottom: 14px;
    border-left: 6px solid var(--accent);
  }
  .now .what { font-size: 24px; font-weight: 700; }
  .now .clock { font-size: 34px; font-weight: 300; text-align: right; }
  .now .page { color: var(--dim); font-size: 15px; grid-column: 1 / 3; }
  .now .held { color: var(--hold); font-weight: 600; font-size: 14px; grid-column: 1 / 3; display: none; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  section h2 { margin: 2px 4px 10px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .row { display: grid; gap: 8px; }
  .row.three { grid-template-columns: repeat(3, 1fr); }
  .row.two { grid-template-columns: repeat(2, 1fr); }
  .row.chips { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  button {
    font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; min-height: 48px; cursor: pointer; transition: transform .06s, background .15s;
  }
  button:active { transform: scale(.97); }
  button.on { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 700; }
  button.big { font-size: 17px; padding: 16px 8px; }
  button.hold.on { background: var(--hold); border-color: var(--hold); }
  .row.chips button { font-size: 15px; padding: 10px 6px; overflow-wrap: anywhere; }
  #pages-box { display: none; }
  .pin { display: none; text-align: center; padding: 24px 12px; }
  .pin input { font: inherit; font-size: 24px; letter-spacing: .3em; text-align: center; width: 9em; padding: 10px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); margin: 12px 0; }
  footer { color: var(--dim); text-align: center; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Simple-Info</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  </header>

  <section class="pin" id="pinbox">
    <h2>Enter the PIN</h2>
    <div>It's in Simple-Info's Settings.</div>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8"><br>
    <button class="on" onclick="savePin()">Connect</button>
  </section>

  <div id="ui">
    <div class="now" id="now">
      <div class="what" id="what">–</div>
      <div class="clock" id="clock">--:--</div>
      <div class="page" id="page"></div>
      <div class="held" id="held">❚❚ Paused: staying on this page</div>
    </div>

    <section>
      <h2>Boards</h2>
      <div class="row chips" id="boards"></div>
    </section>

    <section id="pages-box">
      <h2>Pages</h2>
      <div class="row two" style="margin-bottom: 8px">
        <button class="big" onclick="send('page','previous')">◀ Previous</button>
        <button class="big" onclick="send('page','next')">Next ▶</button>
      </div>
      <div class="row chips" id="pages"></div>
    </section>

    <section>
      <h2>Controls</h2>
      <div class="row two">
        <button class="big hold" id="pause" onclick="send('pause','toggle')">❚❚ Pause</button>
        <button class="big" id="cycle" onclick="send('cycle','toggle')">Move on by itself</button>
        <button onclick="send('refresh','now')">↻ Refresh now</button>
        <button id="fullscreen" onclick="send('fullscreen','toggle')">Full screen</button>
      </div>
    </section>
    <footer id="footer"></footer>
  </div>
</main>

<script>
  let pin = localStorage.getItem("info-pin") || "";
  let boardsShown = "", pagesShown = "";

  function headers() { return { "Content-Type": "application/json", "X-Info-Pin": pin }; }

  function setStatus(ok, text) {
    document.getElementById("dot").style.background = ok ? "var(--good)" : "#e0634a";
    document.getElementById("status").textContent = text;
  }

  function askPin() {
    document.getElementById("pinbox").style.display = "block";
    document.getElementById("ui").style.display = "none";
  }

  function savePin() {
    pin = document.getElementById("pin").value.trim();
    localStorage.setItem("info-pin", pin);
    document.getElementById("pinbox").style.display = "none";
    document.getElementById("ui").style.display = "block";
    refresh();
  }

  async function send(action, value) {
    try {
      const r = await fetch("/api/command", { method: "POST", headers: headers(), body: JSON.stringify({ action, value }) });
      if (r.status === 401) return askPin();
      setTimeout(refresh, 300);
    } catch (e) { setStatus(false, "not connected"); }
  }

  function buttons(boxId, items, onPick) {
    const box = document.getElementById(boxId);
    box.innerHTML = "";
    items.forEach((item, i) => {
      const b = document.createElement("button");
      b.textContent = item.label;
      b.dataset.value = item.value;
      b.onclick = () => onPick(item.value);
      box.appendChild(b);
    });
  }

  function mark(boxId, value) {
    document.querySelectorAll(`#${boxId} button`).forEach(b => b.classList.toggle("on", b.dataset.value === String(value)));
  }

  async function refresh() {
    try {
      const r = await fetch("/api/state", { headers: headers(), cache: "no-store" });
      if (r.status === 401) return askPin();
      const s = await r.json();
      setStatus(true, "connected");
      document.getElementById("clock").textContent = s.time;
      document.getElementById("what").textContent = s.board_title;
      document.getElementById("now").style.borderLeftColor = s.accent || "var(--accent)";
      const pageText = s.pages.length > 1 ? `${s.pages[s.page] || ""}  ·  page ${s.page + 1} of ${s.pages.length}` : (s.pages[0] || "");
      document.getElementById("page").textContent = pageText;
      document.getElementById("held").style.display = s.paused ? "block" : "none";

      const boardKey = JSON.stringify(s.boards);
      if (boardKey !== boardsShown) {
        buttons("boards", s.boards.map(b => ({ label: b.title, value: b.key })), key => send("board", key));
        boardsShown = boardKey;
      }
      mark("boards", s.board);

      const pagesKey = JSON.stringify(s.pages);
      document.getElementById("pages-box").style.display = s.pages.length > 1 ? "block" : "none";
      if (pagesKey !== pagesShown) {
        buttons("pages", s.pages.map((name, i) => ({ label: name, value: i })), i => send("page", i));
        pagesShown = pagesKey;
      }
      mark("pages", s.page);

      const pause = document.getElementById("pause");
      pause.classList.toggle("on", s.paused);
      pause.textContent = s.paused ? "▶ Carry on" : "❚❚ Pause";
      document.getElementById("cycle").classList.toggle("on", s.cycle);
      document.getElementById("fullscreen").classList.toggle("on", s.fullscreen);
      document.getElementById("footer").textContent = `Simple-Info ${s.version}`;
    } catch (e) { setStatus(false, "not connected"); }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
